name: API 研究支持
description: 为明确的开放科研阶段申请模型 API 额度
title: "[support] "
body:
  - type: markdown
    attributes:
      value: 介绍你准备开展的研究，以及模型 API 将用在哪些工作中。请填写可以公开的内容，密钥通过私密渠道交付。
  - type: input
    id: project
    attributes:
      label: 项目或研究提案链接
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 本阶段研究目标与 API 用途
    validations:
      required: true
  - type: textarea
    id: budget
    attributes:
      label: 预计调用需求、期限及估算依据
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: 这阶段准备完成和分享什么？
      description: 例如一个可运行案例、一项方法检查或研究记录，并说明怎样判断这一步完成。
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: 不能公开的材料类型与限制
      description: 仅说明类型，不上传材料。
  - type: checkboxes
    id: agreement
    attributes:
      label: 申请确认
      options:
        - label: 我理解资源有限、申请需审核；开放范围与许可须在接受支持前确认。
          required: true
        - label: 我没有提交密钥或未经许可的私人材料。
          required: true
