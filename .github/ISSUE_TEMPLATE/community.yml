name: 社区反馈
description: 页面、链接或参与流程遇到了问题
title: "[community] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？
      description: 可以附页面链接、截图或操作步骤。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 你建议怎样改？
      description: 有想法可以写下来，也可以留空。
