name: 公共事务与改进
description: 社区文档、参与流程、资源规则或跨项目事项
title: "[community] "
body:
  - type: markdown
    attributes:
      value: 科研任务请优先提交到对应项目仓库。只填写可公开信息。
  - type: textarea
    id: problem
    attributes:
      label: 现在遇到什么问题
      description: 附相关页面、讨论或可复现步骤。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望改善什么
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 如何判断改善有效
      description: 可以是一次具体操作、一处文档修正或可检查的标准。
    validations:
      required: true
