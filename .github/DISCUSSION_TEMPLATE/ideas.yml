title: "[项目提案] "
body:
  - type: markdown
    attributes:
      value: "介绍你的科研项目或工具。当前由 [@wenkuizhao261-pixel](https://github.com/wenkuizhao261-pixel) 接手提案，正式项目进入组织仓库，作者继续维护。"
  - type: textarea
    id: purpose
    attributes:
      label: 项目想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: progress
    attributes:
      label: 目前做到哪里？
      description: 已有代码或案例时附上链接；也可以描述正在尝试的部分。
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 为什么开始做这个项目？（选填）
  - type: textarea
    id: collaboration
    attributes:
      label: 希望得到什么帮助？（选填）
  - type: textarea
    id: maintenance
    attributes:
      label: 接下来准备怎样维护和开放？（选填）
