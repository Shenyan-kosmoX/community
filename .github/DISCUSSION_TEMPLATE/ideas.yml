title: "[项目提案] "
body:
  - type: markdown
    attributes:
      value: 介绍你正在做的研究或工具，以及希望别人怎样加入。发帖后可提及项目提案说明中的联系人，后续在这篇帖子里继续沟通。
  - type: textarea
    id: problem
    attributes:
      label: 你想持续研究什么？
      description: 为什么这个问题让你愿意投入？接下来最想推进哪一步？
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: 已经做到哪里了？
      description: 附代码、案例或研究记录，也说说目前还运行不了的部分。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 怎样判断结果？目前还有什么拿不准？
      description: 可以写已有参照、准备做的检查，或尚未找到合适方法的问题。
    validations:
      required: true
  - type: textarea
    id: stewardship
    attributes:
      label: 希望别人怎样参与？
      description: 说说你准备负责什么、需要哪类帮助，以及希望开放的内容。
    validations:
      required: true
