title: "[研究问题] "
body:
  - type: markdown
    attributes:
      value: 有个想法想聊聊，或遇到了一个一直没想明白的问题？从你现在知道的地方说起就好。
  - type: textarea
    id: question
    attributes:
      label: 什么问题让你感到好奇？
      description: 可以是一篇文章、一个现象，也可以是你自己的疑问。
    validations:
      required: true
  - type: textarea
    id: basis
    attributes:
      label: 你已经看过或试过什么？
      description: 有参考或记录就附上；刚开始想这个问题也没关系。
  - type: textarea
    id: help
    attributes:
      label: 想和大家一起想清楚哪一部分？
