name: SORS project review

on:
  workflow_call:
    inputs:
      checker-ref:
        description: Full community commit SHA containing the reviewed checker
        type: string
        required: true

permissions:
  contents: read

jobs:
  project-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Require a fixed checker version
        env:
          SORS_CHECKER_REF: ${{ inputs.checker-ref }}
        run: '[[ "$SORS_CHECKER_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Shenyan-kosmoX/community
          ref: ${{ inputs.checker-ref }}
          path: sors-tooling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the fixed checker dependencies
        run: python -m pip install -r sors-tooling/requirements-dev.txt
      - name: Check project and case indexes
        run: python sors-tooling/standards/SORS/tools/check_project.py --root project --report "$RUNNER_TEMP/sors-review.json"
      - name: Summarize maintenance changes
        if: always() && github.event_name == 'pull_request'
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: python sors-tooling/standards/SORS/tools/summarize_changes.py --root project --base "$REVIEW_BASE"
      - name: Save structural report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sors-structure
          path: ${{ runner.temp }}/sors-review.json
          if-no-files-found: warn
          retention-days: 14
