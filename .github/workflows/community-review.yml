name: Community review
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  structure-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-19
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-10-19
        with:
          python-version: '3.12'
      - name: Install checker dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Check public content
        run: python tools/check.py --report check-report.json
      - name: Test honest failure and validation behavior
        run: python -m unittest discover -s tests -v
  review-sensitive-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Summarize paths for human review
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: python tools/sensitive_changes.py --base "$REVIEW_BASE"
